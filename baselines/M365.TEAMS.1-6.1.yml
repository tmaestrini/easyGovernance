Topic: MS Teams
Type: Baseline
Id: M365.1-6.1
Version: 1.0

References:
  - https://www.cisa.gov/sites/default/files/2023-12/Teams%20SCB_12.20.2023.pdf
  - https://web.archive.org/web/20250311072210/https://blueprint.oobe.com.au/as-built-as-configured/office-365/#microsoft-teams

Configuration:
  # Teams setting
  - enforces: TeamsSettings
    with:
      FeedSuggestionsInUsersActivityFeed: Allow
      WhoCanManageTags: TeamOwners
      LetTeamOwnersChangeWhoCanManageTags: Allow
      CustomTags: Allow
      ShiftsAppCanApplyTags: Allow
      AllowUsersCanSendEmailsToAChannel: Allow
      AllowCitrix: Block
      AllowDropBox: Block
      AllowBox: Block
      AllowGoogleDrive: Block
      AllowEgnyte: Block
      AllowOrganizationTabForUsers: Allow
      Require2ndAuthforMeeting: NoAccess
      SetContentPin: RequiredOutsideScheduleMeeting
      SurfaceHubCanSendMails: Allow
      ScopeDirectorySearch: Allow
      ExtendedWorkInfoInPeopleSearch: Block
      RoleBasedChatPermissions: Block
      # ProvideLinkToSupportRequestPage: false # TODO: ⭐️ discuss API call (do you know how to get it?) [Dako365]: should be "tenantSharedChannelsSettings" https://teams.microsoft.com/api/mt/emea/beta/admin/tenantSharedChannelsSettings

  # Org-wide default Teams policy
  - enforces: TeamsPolicies
    with:
      # Name: "Global" # not settable anymore (default policy in admin center)
      CreatePrivateChannels: Allow

  # Org-wide default Teams App policy
  - enforces: AppPolicy
    with:
      Name: "Global"
      # TODO: ⭐️ [Dako365]: we need to add "tailored apps" for tenants with F license, value needs to be discussed, API call should be https://substrate.office.com/AdminAppCatalog/v2/admin/unifiedApps/settings, response "appType": "DefaultApp", "availableToType": "None"
      # MicrosoftApps: Allow # TODO: ⭐️ discuss API call (do you know how to get it?) [Dako365]: API call should be https://substrate.office.com/AdminAppCatalog/v2/admin/unifiedApps/settings, response "appType": "GlobalApp", "availableToType": "All"
      # ThirdPartyApps: Block # TODO: ⭐️ discuss API call (do you know how to get it?) [Dako365]: API call should be https://substrate.office.com/AdminAppCatalog/v2/admin/unifiedApps/settings, response "appType": "PrivateApp", "availableToType": "None"
      UploadCustomApps: Block
      UserPinning: Allow

  # Org-wide default Teams Calling policy
  - enforces: CallingPolicy
    with:
      Name: "Global"
      MakePrivateCalls: Allow
      CloudRecordingForCalling: Block
      # InternalCallForwardingAndRinging: Allow # TODO: ⭐️ discuss API call (do you know how to get it?) [Dako365]: API call should be https://api.interfaces.records.teams.microsoft.com/Skype.Policy/configurations/TeamsCallingPolicy/configuration/Global AllowCallForwardingToUser : false
      # ExternalCallForwardingAndRinging: Block # TODO: ⭐️ discuss API call (do you know how to get it?) [Dako365]: API call should be https://api.interfaces.records.teams.microsoft.com/Skype.Policy/configurations/TeamsCallingPolicy/configuration/Global AllowCallForwardingToPhone : false
      VoicemailEnabledForRoutingInboundCalls: AlwaysEnabled || UserOverride
      # DelegationInboundOutbound: Allow # TODO: ⭐️ discuss API call (do you know how to get it?) [Dako365]: API call should be https://api.interfaces.records.teams.microsoft.com/Skype.Policy/configurations/TeamsCallingPolicy/configuration/Global AllowDelegation : false
      PreventTollBypass: Block
      MusicOnHoldPSTN: Enabled
      BusyOnBusy: Allow
      WebPSTNCalling: Block
      RealTimeCaptions: Allow
      AutoAnswerMeetingInvites: Block
      SIPDevicesPerformCalling: Block
      CopilotEnabled: Block # TODO: ⭐️ discuss API call (what value are we going to recommend?) [Dako365]: I would prefer to go with the least permissive approach -> disabled

  # Org-wide default Teams meeting policy
  - enforces: MeetingPolicy
    with:
      Name: "Global"
      MeetNowInChannels: Allow
      OutlookAddIn: Allow
      ChannelMeetingScheduling: Allow
      PrivateMeetingScheduling: Allow
      EngagementReport: Allow
      MeetingRegistration: Allow
      WhoCanRegister: Everyone
      Audio: Allow
      ModeForIPAudio: EnabledOutgoingIncoming
      ModeforIPVideo: EnabledOutgoingIncoming
      IPVideo: Allow
      LocalBroadcasting: Block
      MediaBitRateKb: 50000
      NetworkConfigurationLookup: Block
      Transcription: Block
      CloudRecording: Allow
      MeetingsAutomaticallyExpire: Allow
      DefaultExpirationTimeDays: 60
      StoreRecordingsOutsideofYourCountry: Block
      ScreenSharingMode: EntireScreen
      AllowInternalParticipantGiveRequestControl: Allow
      AllowExternalParticipantGiveRequestControl: Block
      PowerPointSharing: Allow
      Whiteboard: Allow
      SharedNotes: Allow
      SelectVideoFilters: AllFilters
      AnonymousJoinMeeting: Block
      AnonymousStartMeeting: Block
      RolesWithPresenterRights: EveryoneUserOverride # Everyone, but user can override
      AutoAdmitPeople: PeopleInMyOrganization
      AllowDialInBypassLobby: Block
      MeetNowPrivateMeetings: Allow
      LiveCaptions: NotEnabledButTheUserCanOverride
      ChatInMeetings: Allow
    references:
      ChannelMeetingScheduling: "see setting 'Channel meeting scheduling'"
      MeetNowInChannels: "see setting 'Meet now in channel meetings' and 'Meet now in private meetings'"

  # Org-wide default Teams live events policy
  - enforces: LiveEventsPolicy
    with:
      Name: "Global"
      LiveEventScheduling: Allow
      TranscriptionForAttendees: Block
      WhoCanJoin: EveryoneInCompany
      RecordingMode: AlwaysEnabled

  # External access settings
  - enforces: ExternalAccess
    with:
      UsersInExternalOrgs: AllowEveryone || AllowOnlySpecificExternalDomains # TODO: ⭐️ discuss setting; what value(s) are we going to recommend? [Dako365]: I would prefer to go with the least permissive approach -> AllowOnlySpecificExternalDomains
      AllowedExternalDomains: "contoso.com" # Set this in a comma separated list; set to blank if all domains allowed
      ExternalAccessWithTrialTenants: Block
      MyOrgCanCommunicateWithUnmanagedAccounts: Block
      UnmanagedAccountsCanContactMyOrg: Block
      # UsersCanCommunicateWithSkypeUsers: Allow # not settable anymore (default policy in admin center)

  # Guest access settings
  - enforces: GuestAccess
    with:
      AllowGuestsToAccessTeams: Allow
      MakePrivateCalls: Allow
      VideoConferencing: Allow
      ScreenSharingMode: EntireScreen
      MeetNow: Allow
      EditSentMessages: Allow
      DeleteSentMessages: Allow
      DeleteChat: Allow
      Chat: Allow
      GiphyInConversations: Block
      GiphyContentRating: Strict
      MemesInConversations: Block
      StickersInConversations: Block
      ImmerseReaderForMessages: Allow
